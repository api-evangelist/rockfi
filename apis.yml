name: RockFi
description: 'RockFi is a French private wealth management firm positioning itself as a
  modern family office, pairing experienced private-banking advisors with technology to
  serve high-net-worth entrepreneurs, executives, athletes, and independent professionals.
  Its fixed-fee model offers life insurance (France and Luxembourg), structured funds,
  private equity, SCPI real estate, PEA and securities accounts, customized investment
  mandates, and consolidated real-time portfolio monitoring, tax optimization, and
  wealth-transmission planning. Registered with ORIAS (23004556) under ACPR and AMF
  oversight. Backed by Partech. No public developer API is currently published; this
  profile has been enriched from the public site.'
